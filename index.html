<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diego Eduardo Schatz</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>

    <div class="calcularDesconto">
        <h2>Calcular Desconto</h2>

        <label for="preco">Valor do Produto (R$):</label>
        <input type="number" id="preco" placeholder="Ex: 100.00" step="0.01"><br>

        <label for="desconto">Desconto (%):</label>
        <input type="number" id="desconto" placeholder="Ex: 15"><br><br>

        <button onclick="calcularDesconto()">Calcular</button><br>

    </div>

    <h3 id="resultado"></h3>

</body>

</html>
